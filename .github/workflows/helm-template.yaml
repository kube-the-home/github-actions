name: Helm Template

on:
  workflow_call:
    inputs:
      chart_path:
        description: 'Path to the Helm chart directory (e.g. charts/my-chart)'
        required: true
        type: string
      values:
        description: 'Values to pass to helm template as a YAML string'
        required: false
        type: string
        default: ''
      helm_version:
        description: 'Helm version to install'
        required: false
        type: string
        default: 'latest'
      runs_on:
        description: 'Runner OS to use'
        required: false
        type: string
        default: 'ubuntu-latest'

jobs:
  template:
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ inputs.helm_version }}

      - name: Run Helm template
        env:
          VALUES: ${{ inputs.values }}
          CHART_PATH: ${{ inputs.chart_path }}
        run: |
          if [ -n "$VALUES" ]; then
            printf '%s' "$VALUES" > /tmp/override-values.yaml
            helm template "$CHART_PATH" -f /tmp/override-values.yaml
          else
            helm template "$CHART_PATH"
          fi
