name: Helm Template

on:
  workflow_call:
    inputs:
      chart_path:
        description: 'Path to the Helm chart directory (e.g. charts/my-chart)'
        required: true
        type: string
      values:
        description: 'Values to pass to helm template as a YAML string'
        required: false
        type: string
        default: ''
      helm_version:
        description: 'Helm version to install'
        required: false
        type: string
        default: 'latest'
      runs_on:
        description: 'Runner OS to use'
        required: false
        type: string
        default: 'ubuntu-latest'

jobs:
  template:
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm_version }}

      - name: Run Helm template
        env:
          VALUES: ${{ inputs.values }}
        run: |
          if [ -n "$VALUES" ]; then
            printf '%s' "$VALUES" > /tmp/override-values.yaml
            helm template ${{ inputs.chart_path }} -f /tmp/override-values.yaml
          else
            helm template ${{ inputs.chart_path }}
          fi
