name: Helm Release

on:
  workflow_call:
    inputs:
      chart_path:
        description: 'Path to the Helm chart directory (e.g. charts/my-chart)'
        required: true
        type: string
      version:
        description: 'Chart version to release (without v prefix, e.g. 1.2.3)'
        required: true
        type: string
      helm_version:
        description: 'Helm version to install'
        required: false
        type: string
        default: 'latest'
      helm_dependency_repos:
        description: |
          Newline-separated list of Helm dependency repos to add before packaging.
          Each line must be: <name> <url>
          Example: "opentelemetry-collector https://open-telemetry.github.io/opentelemetry-helm-charts"
        required: false
        type: string
        default: ''
      runs_on:
        description: 'Runner OS to use'
        required: false
        type: string
        default: 'ubuntu-latest'
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

jobs:
  helm-release:
    permissions:
      contents: write
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Update Chart.yaml version
        env:
          VERSION: ${{ inputs.version }}
          CHART_PATH: ${{ inputs.chart_path }}
        run: |
          sed -i "s/^version:.*/version: ${VERSION}/" "${CHART_PATH}/Chart.yaml"
          git add "${CHART_PATH}/Chart.yaml"

      - name: Run Helm Docs
        uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # v2.0.1

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ inputs.helm_version }}

      - name: Add Helm dependency repositories
        if: inputs.helm_dependency_repos != ''
        env:
          HELM_REPOS: ${{ inputs.helm_dependency_repos }}
        run: |
          echo "$HELM_REPOS" | while IFS= read -r line; do
            [ -z "$line" ] && continue
            name=$(echo "$line" | awk '{print $1}')
            url=$(echo "$line" | awk '{print $2}')
            helm repo add "$name" "$url"
          done

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        env:
          CR_TOKEN: ${{ steps.generate-token.outputs.token }}
          # Credentials are not persisted by checkout; provide them only to the
          # steps that need to push, via a step-scoped git credential helper.
          GIT_TOKEN: ${{ steps.generate-token.outputs.token }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=${GIT_TOKEN}"; }; f'
        with:
          skip_existing: true

      - name: Commit changes
        env:
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          GIT_TOKEN: ${{ steps.generate-token.outputs.token }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=${GIT_TOKEN}"; }; f'
        run: |
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update Chart.yaml and docs for ${VERSION} [skip ci]"
            git pull --rebase origin "${REF_NAME}"
            git push origin "${REF_NAME}"
          fi
