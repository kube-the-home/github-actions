name: .NET NuGet Release

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory containing the solution or project file"
        required: false
        type: string
        default: "."
      dotnet_version:
        description: ".NET SDK version to use (e.g. 8.0.x, 9.0.x)"
        required: false
        type: string
        default: "8.0.x"
      runs_on:
        description: "Runner OS to use"
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      nuget_api_key:
        description: "NuGet API key for pushing packages"
        required: true

jobs:
  nuget-release:
    runs-on: ${{ inputs.runs_on }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Build
        run: dotnet build -c Release

      - name: Pack nugets
        run: dotnet pack -c Release --no-build --output .

      - name: Push to NuGet
        run: dotnet nuget push "*.nupkg" --api-key ${{ secrets.nuget_api_key }} --source https://api.nuget.org/v3/index.json
