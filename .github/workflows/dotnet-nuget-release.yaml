name: .NET NuGet Release

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory containing the solution or project file"
        required: false
        type: string
        default: "."
      dotnet_version:
        description: ".NET SDK version to use (e.g. 8.0.x, 9.0.x)"
        required: false
        type: string
        default: "8.0.x"
      runs_on:
        description: "Runner OS to use"
        required: false
        type: string
        default: "ubuntu-latest"
      nuget_user:
        description: "nuget.org username (profile name, not email) that owns the trusted publishing policy"
        required: true
        type: string

jobs:
  nuget-release:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
      id-token: write # required for NuGet trusted publishing (OIDC)
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Build
        run: dotnet build -c Release

      - name: Pack nugets
        run: dotnet pack -c Release --no-build --output .

      - name: NuGet login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ inputs.nuget_user }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
