name: GitOps Linter

on:
  workflow_call:
    inputs:
      runs_on:
        description: 'Runner OS to use'
        required: false
        type: string
        default: 'ubuntu-latest'
      fail_on:
        description: 'Severity level to fail on (error, warning)'
        required: false
        type: string
        default: 'error'
      upload_sarif:
        description: 'Upload SARIF results to GitHub Security tab'
        required: false
        type: string
        default: 'false'

jobs:
  gitops-linter:
    name: GitOps Linter
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run glint
        uses: lukashankeln/glint@cd3deea01f61d5ca55e56849a432f4e1805f2270 # v0.2.9
        with:
          fail-on: ${{ inputs.fail_on }}
