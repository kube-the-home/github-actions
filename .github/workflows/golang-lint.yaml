name: Go Lint

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory containing the Go module"
        required: false
        type: string
        default: "."
      go_version:
        description: "Go version to use (e.g. stable, 1.23.x)"
        required: false
        type: string
        default: "stable"
      golangci_lint_version:
        description: "golangci-lint version to use (e.g. latest, v1.64.0)"
        required: false
        type: string
        default: "latest"
      runs_on:
        description: "Runner OS to use"
        required: false
        type: string
        default: "ubuntu-latest"

jobs:
  lint:
    runs-on: ${{ inputs.runs_on }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci_lint_version }}
          working-directory: ${{ inputs.working_directory }}
