name: Go Lint

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory containing the Go module"
        required: false
        type: string
        default: "."
      go_version:
        description: "Go version to use (e.g. stable, 1.23.x)"
        required: false
        type: string
        default: "stable"
      golangci_lint_version:
        description: "golangci-lint version to use (e.g. latest, v1.64.0)"
        required: false
        type: string
        default: "latest"
      runs_on:
        description: "Runner OS to use"
        required: false
        type: string
        default: "ubuntu-latest"

jobs:
  lint:
    runs-on: ${{ inputs.runs_on }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ inputs.golangci_lint_version }}
          working-directory: ${{ inputs.working_directory }}
