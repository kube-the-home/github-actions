name: Go Test

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory containing the Go module"
        required: false
        type: string
        default: "."
      go_version:
        description: "Go version to use (e.g. stable, 1.23.x)"
        required: false
        type: string
        default: "stable"
      runs_on:
        description: "Runner OS to use"
        required: false
        type: string
        default: "ubuntu-latest"

jobs:
  test:
    runs-on: ${{ inputs.runs_on }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}

      - name: Test
        run: go test -v ./...
