name: Go Test

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory containing the Go module"
        required: false
        type: string
        default: "."
      go_version:
        description: "Go version to use (e.g. stable, 1.23.x)"
        required: false
        type: string
        default: "stable"
      runs_on:
        description: "Runner OS to use"
        required: false
        type: string
        default: "ubuntu-latest"

jobs:
  test:
    runs-on: ${{ inputs.runs_on }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ inputs.go_version }}

      - name: Test
        run: go test -v ./...
