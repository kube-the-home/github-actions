name: Semantic Release

on:
  workflow_call:
    inputs:
      runs_on:
        description: 'Runner OS to use'
        required: false
        type: string
        default: 'ubuntu-latest'
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
    outputs:
      new_version:
        description: 'The new version created by semantic-release (without v prefix), empty if no release was made'
        value: ${{ jobs.release.outputs.new_version }}

jobs:
  release:
    permissions:
      contents: write
    runs-on: ${{ inputs.runs_on }}
    outputs:
      new_version: ${{ steps.semantic-release.outputs.new_release_version }}
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Run semantic release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@9e1f8a3ef91f1097285028e799a5fb8bb90e8899 # v8.1.0
        with:
          extra_plugins: |
            @semantic-release/git
            conventional-changelog-conventionalcommits@7
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
