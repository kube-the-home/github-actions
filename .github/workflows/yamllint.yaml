name: Yamllint

on:
  workflow_call:
    inputs:
      file_or_dir:
        description: 'File or directory to lint'
        required: false
        type: string
        default: '.'
      runs_on:
        description: 'Runner OS to use'
        required: false
        type: string
        default: 'ubuntu-latest'

jobs:
  yamllint:
    name: Yamllint
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Yamllint
        uses: karancode/yamllint-github-action@4052d365f09b8d34eb552c363d1141fd60e2aeb2 # v3.0.0
        with:
          yamllint_file_or_dir: ${{ inputs.file_or_dir }}
