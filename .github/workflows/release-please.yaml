name: Release Please

on:
  workflow_call:
    inputs:
      release_type:
        description: 'Release type for release-please (e.g. simple, node, python). Leave empty to use config-file only.'
        required: false
        type: string
        default: ''
      config_file:
        description: 'Path to release-please config file'
        required: false
        type: string
        default: 'release-please-config.json'
      manifest_file:
        description: 'Path to release-please manifest file'
        required: false
        type: string
        default: '.release-please-manifest.json'
      auto_release:
        description: 'Automatically merge the release PR when checks pass'
        required: false
        type: boolean
        default: false
      label_release_type:
        description: 'Label the release PR with updateType:patch|minor|major based on the version bump'
        required: false
        type: boolean
        default: true
      runs_on:
        description: 'Runner OS to use'
        required: false
        type: string
        default: 'ubuntu-latest'
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
    outputs:
      release_created:
        description: 'Whether a release was created'
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: 'The tag name of the created release'
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: 'The version of the created release (without v prefix)'
        value: ${{ jobs.release-please.outputs.version }}
      pr:
        description: 'The release PR number, if one was created or updated'
        value: ${{ jobs.release-please.outputs.pr }}
      pull_request_url:
        description: 'The URL of the release PR, if one was created or updated'
        value: ${{ jobs.release-please.outputs.pull_request_url }}

jobs:
  release-please:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}
      pull_request_url: ${{ steps.release.outputs.pull-request-url }}
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.generate-token.outputs.token }}
          release-type: ${{ inputs.release_type }}
          config-file: ${{ inputs.config_file }}
          manifest-file: ${{ inputs.manifest_file }}

      - name: Label release PR with update type
        if: ${{ inputs.label_release_type && steps.release.outputs.pr }}
        run: |
          set -euo pipefail

          PR_NUMBER=$(jq -r '.number' <<< "$PR_JSON")
          HEAD_BRANCH=$(jq -r '.headBranchName' <<< "$PR_JSON")
          BASE_BRANCH=$(jq -r '.baseBranchName' <<< "$PR_JSON")

          fetch_manifest() {
            gh api "repos/${REPOSITORY}/contents/${MANIFEST_FILE}?ref=$1" --jq '.content' | base64 --decode
          }

          OLD_MANIFEST=$(fetch_manifest "$BASE_BRANCH")
          NEW_MANIFEST=$(fetch_manifest "$HEAD_BRANCH")

          UPDATE_TYPE=""
          for path in $(jq -r 'keys[]' <<< "$NEW_MANIFEST"); do
            OLD_V=$(jq -r --arg p "$path" '.[$p] // empty' <<< "$OLD_MANIFEST")
            NEW_V=$(jq -r --arg p "$path" '.[$p] // empty' <<< "$NEW_MANIFEST")

            if [ -z "$OLD_V" ] || [ "$OLD_V" = "$NEW_V" ]; then
              continue
            fi

            IFS='.' read -r OLD_MAJOR OLD_MINOR _ <<< "$OLD_V"
            IFS='.' read -r NEW_MAJOR NEW_MINOR _ <<< "$NEW_V"

            if [ "$NEW_MAJOR" != "$OLD_MAJOR" ]; then
              TYPE="major"
            elif [ "$NEW_MINOR" != "$OLD_MINOR" ]; then
              TYPE="minor"
            else
              TYPE="patch"
            fi

            case "$TYPE" in
              major) UPDATE_TYPE="major" ;;
              minor) [ "$UPDATE_TYPE" != "major" ] && UPDATE_TYPE="minor" ;;
              patch) [ -z "$UPDATE_TYPE" ] && UPDATE_TYPE="patch" ;;
            esac
          done

          if [ -z "$UPDATE_TYPE" ]; then
            echo "Could not determine version bump from manifest diff; skipping label"
            exit 0
          fi

          for other in major minor patch; do
            if [ "$other" != "$UPDATE_TYPE" ]; then
              gh pr edit "$PR_NUMBER" --repo "$REPOSITORY" --remove-label "updateType:${other}" 2>/dev/null || true
            fi
          done

          gh pr edit "$PR_NUMBER" --repo "$REPOSITORY" --add-label "updateType:${UPDATE_TYPE}"
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          MANIFEST_FILE: ${{ inputs.manifest_file }}
          PR_JSON: ${{ steps.release.outputs.pr }}

      - name: Auto-merge release PR
        if: ${{ inputs.auto_release && steps.release.outputs.pr }}
        run: |
          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number')
          gh pr merge --rebase --admin "${SERVER_URL}/${REPOSITORY}/pull/${PR_NUMBER}"
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          PR_JSON: ${{ steps.release.outputs.pr }}
