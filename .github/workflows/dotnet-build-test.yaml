name: .NET Build and Test

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory containing the solution or project file"
        required: false
        type: string
        default: "."
      dotnet_version:
        description: ".NET SDK version to use (e.g. 8.0.x, 9.0.x)"
        required: false
        type: string
        default: "8.0.x"
      configuration:
        description: "Build configuration (Debug or Release)"
        required: false
        type: string
        default: "Release"
      runs_on:
        description: "Runner OS to use"
        required: false
        type: string
        default: "ubuntu-latest"

jobs:
  build-test:
    runs-on: ${{ inputs.runs_on }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration ${{ inputs.configuration }}

      - name: Test
        run: dotnet test --no-build --configuration ${{ inputs.configuration }} --verbosity normal
